<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascendia Hire | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Apply saved theme/accent before paint to avoid a flash of wrong colors.
        (function(){
            var t = localStorage.getItem("ah_theme") || "light";
            var a = localStorage.getItem("ah_accent") || "indigo";
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.setAttribute("data-accent", a);
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0a0a14;
            --ink2: #111827;
            --surface: #ffffff;
            --sidebar-bg: #0e0e1f;
            --sidebar-border: rgba(255,255,255,0.06);
            --accent: #4f46e5;
            --accent-light: #818cf8;
            --accent2: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warn: #f59e0b;
            --muted: #64748b;
            --muted2: #94a3b8;
            --border: #e8eaf0;
            --border2: #f1f5f9;
            --card-bg: #ffffff;
            --page-bg: #f4f6fb;
            --header-bg: #ffffff;
            --text: #0f172a;
            --text2: #475569;
            --input-bg: #f8fafc;
            --hover-bg: #eef2ff;
            --hover-text: #4338ca;
            --transition-theme: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        /* ── Accent presets ── */
        html[data-accent="indigo"]  { --accent: #4f46e5; --accent2: #7c3aed; --accent-light: #818cf8; }
        html[data-accent="violet"]  { --accent: #8b5cf6; --accent2: #d946ef; --accent-light: #c4b5fd; }
        html[data-accent="emerald"] { --accent: #059669; --accent2: #0d9488; --accent-light: #34d399; }
        html[data-accent="rose"]    { --accent: #e11d48; --accent2: #db2777; --accent-light: #fb7185; }
        html[data-accent="amber"]   { --accent: #d97706; --accent2: #ea580c; --accent-light: #fbbf24; }
        html[data-accent="sky"]     { --accent: #0284c7; --accent2: #4338ca; --accent-light: #38bdf8; }

        /* ── Dark theme ── */
        html[data-theme="dark"] {
            --surface: #11131f;
            --card-bg: #161827;
            --page-bg: #0b0c14;
            --header-bg: #11131f;
            --text: #e8eaf2;
            --text2: #aab2c5;
            --muted: #8b93a8;
            --muted2: #6b7385;
            --border: #232739;
            --border2: #1c1f2e;
            --input-bg: #1a1c2b;
            --hover-bg: #1d2036;
            --hover-text: var(--accent-light);
        }

        body { transition: var(--transition-theme); }
        #appHeader, #mainView, .card, .input-field, .btn-sm-outline { transition: var(--transition-theme); }

        /* Defeat inline styles from dynamically-rendered JS content so dark
           mode applies app-wide without rewriting every render function. */
        html[data-theme="dark"] [style*="color:#0f172a"]   { color: var(--text) !important; }
        html[data-theme="dark"] [style*="color: #0f172a"]  { color: var(--text) !important; }
        html[data-theme="dark"] [style*="color:#94a3b8"]   { color: var(--muted2) !important; }
        html[data-theme="dark"] [style*="color:#64748b"]   { color: var(--muted) !important; }
        html[data-theme="dark"] [style*="color:#475569"]   { color: var(--text2) !important; }
        html[data-theme="dark"] [style*="background:#f8fafc"]   { background: var(--input-bg) !important; }
        html[data-theme="dark"] [style*="background:#f1f5f9"]   { background: var(--border2) !important; border-color: var(--border) !important; }
        html[data-theme="dark"] [style*="background:white"]     { background: var(--card-bg) !important; }
        html[data-theme="dark"] [style*="background:#fff"]      { background: var(--card-bg) !important; }
        html[data-theme="dark"] [style*="border-bottom:1px solid #f1f5f9"] { border-color: var(--border) !important; }
        html[data-theme="dark"] [style*="border:1px solid #eef0f5"]       { border-color: var(--border) !important; }
        html[data-theme="dark"] [style*="background:#eef2ff"]   { background: rgba(129,140,248,0.12) !important; }
        html[data-theme="dark"] [style*="background:#fffbeb"]   { background: rgba(245,158,11,0.1) !important; }
        html[data-theme="dark"] [style*="background:#f0fdf4"]   { background: rgba(16,185,129,0.12) !important; }
        html[data-theme="dark"] [style*="background:#fef2f2"]   { background: rgba(239,68,68,0.12) !important; }
        html[data-theme="dark"] [style*="background:rgba(0,0,0,0.5)"] { background: rgba(0,0,0,0.7) !important; }
        html[data-theme="dark"] .field-input,
        html[data-theme="dark"] input,
        html[data-theme="dark"] textarea,
        html[data-theme="dark"] select { color: var(--text); }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--page-bg);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
        }

        /* ── SIDEBAR ── */
        #appSidebar {
            width: 230px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid var(--sidebar-border);
            z-index: 50;
            transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
        }

        .sidebar-logo {
            padding: 1.25rem 1.25rem 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--sidebar-border);
        }
        .sidebar-logo-icon {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: white;
            box-shadow: 0 3px 12px rgba(79,70,229,0.45);
            flex-shrink: 0;
            transition: transform 0.25s;
        }
        .sidebar-logo:hover .sidebar-logo-icon { transform: rotate(-8deg) scale(1.05); }
        .sidebar-logo-text {
            font-size: 1rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.02em;
        }
        .sidebar-logo-text span { color: #818cf8; }

        #sidebarNav {
            flex: 1;
            padding: 0.75rem 0.6rem;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #sidebarNav::-webkit-scrollbar { display: none; }

        .nav-section-label {
            font-size: 0.62rem;
            font-weight: 700;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.6rem 0.7rem 0.3rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.83rem;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            transition: all 0.15s;
            color: #64748b;
            border: none;
            background: transparent;
            text-align: left;
        }
        .nav-btn i { width: 18px; text-align: center; flex-shrink: 0; font-size: 13px; }
        .nav-btn:hover { background: rgba(255,255,255,0.06); color: #c7d2fe; transform: translateX(2px); }
        .nav-btn.active {
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 28%, transparent), color-mix(in srgb, var(--accent2) 18%, transparent));
            color: var(--accent-light);
            font-weight: 700;
            border: 1px solid color-mix(in srgb, var(--accent-light) 25%, transparent);
        }
        .nav-btn.active i { color: var(--accent-light); }

        .sidebar-user {
            padding: 0.85rem 1rem;
            border-top: 1px solid var(--sidebar-border);
        }
        .sidebar-user-info {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 0.65rem;
        }
        .sidebar-avatar {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(79,70,229,0.3), rgba(124,58,237,0.3));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            color: #a5b4fc;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .sidebar-user-name { font-size: 0.8rem; font-weight: 700; color: white; }
        .sidebar-user-email { font-size: 0.68rem; color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
        #sidebarRole {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            padding: 0;
            transition: color 0.15s;
        }
        .logout-btn:hover { color: #fca5a5; }

        /* ── MOBILE OVERLAY ── */
        #sidebarOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 40;
        }
        #sidebarOverlay.open { display: block; }

        /* ── MAIN ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        #appHeader {
            height: 56px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border2);
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 0.75rem;
            flex-shrink: 0;
            box-shadow: 0 1px 0 var(--border2);
        }

        #mobileMenuBtn {
            display: none;
            width: 36px; height: 36px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--muted);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        #mobileMenuBtn:hover { border-color: var(--accent-light); color: var(--accent); }

        #pageTitle {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        #headerBadge {
            padding: 0.2rem 0.7rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ── THEME CONTROLS ── */
        #themeControls { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; position: relative; }
        .theme-icon-btn {
            width: 34px; height: 34px;
            border-radius: 9px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            color: var(--muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.18s;
        }
        .theme-icon-btn:hover { border-color: var(--accent-light); color: var(--accent); transform: translateY(-1px); }
        .theme-icon-btn:active { transform: scale(0.92); }
        #accentPanel {
            position: absolute;
            top: 42px; right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.6rem;
            display: none;
            gap: 0.4rem;
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
            z-index: 200;
            animation: popIn 0.15s ease both;
        }
        #accentPanel.open { display: flex; }
        @keyframes popIn { from{opacity:0;transform:translateY(-6px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
        .accent-swatch {
            width: 22px; height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s;
            position: relative;
        }
        .accent-swatch:hover { transform: scale(1.15); }
        .accent-swatch.active { border-color: var(--text); }
        .accent-swatch.active::after {
            content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            color: white; font-size: 9px; position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 2px rgba(0,0,0,0.4);
        }

        #mainView {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
        }
        #mainView > * { animation: viewFade 0.28s ease both; }
        @keyframes viewFade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 14px;
            font-size: 0.83rem;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            max-width: 300px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #toast.show { transform: translateY(0); opacity: 1; }

        /* ── CARDS & COMMON ── */
        .card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 1.4rem;
            border: 1px solid var(--border2);
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            transition: var(--transition-theme), transform 0.18s, box-shadow 0.18s;
        }
        .card:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.08); transform: translateY(-2px); }
        html[data-theme="dark"] .card:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.4); }

        /* ── SKELETON LOADERS ── */
        .skel { border-radius: 12px; background: linear-gradient(100deg, var(--input-bg) 30%, var(--border2) 50%, var(--input-bg) 70%); background-size: 200% 100%; animation: skelShine 1.3s ease-in-out infinite; }
        @keyframes skelShine { from{background-position:150% 0} to{background-position:-50% 0} }
        .skel-card { display:flex; gap:1rem; align-items:flex-start; padding:1.4rem; border-radius:18px; border:1px solid var(--border2); background:var(--card-bg); }
        .skel-line { height:12px; border-radius:6px; }

        /* ── STAT TILES ── */
        .stat-tile {
            background: var(--card-bg); border: 1px solid var(--border2); border-radius: 16px;
            padding: 1rem 1.1rem; display: flex; align-items: center; gap: 0.85rem;
            transition: var(--transition-theme), transform 0.18s, box-shadow 0.18s;
        }
        .stat-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,0.07); }
        html[data-theme="dark"] .stat-tile:hover { box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
        .stat-icon { width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0; }
        .stat-num { font-size:1.35rem;font-weight:800;color:var(--text);letter-spacing:-0.02em;line-height:1.1; }
        .stat-label { font-size:0.7rem;color:var(--muted2);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-top:1px; }
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            margin-bottom: 1rem;
        }
        .tag {
            display: inline-block;
            padding: 0.18rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.68rem;
            font-weight: 700;
        }

        /* input & btn */
        .input-field {
            width: 100%;
            padding: 0.68rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            background: var(--input-bg);
            font-size: 0.87rem;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
        }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.13); background: var(--card-bg); }
        .input-field::placeholder { color: var(--muted2); }

        .btn {
            padding: 0.58rem 1.1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            font-family: 'Outfit', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .btn:active { transform: scale(0.96); }
        .btn-indigo { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; box-shadow: 0 2px 10px rgba(79,70,229,0.25); }
        .btn-indigo:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79,70,229,0.35); }
        .btn-slate  { background: #0f172a; color: white; }
        .btn-slate:hover  { background: var(--accent); }
        .btn-red    { background: #ef4444; color: white; }
        .btn-red:hover    { background: #b91c1c; }
        .btn-green  { background: #059669; color: white; }
        .btn-sm-outline {
            padding: 0.38rem 0.75rem;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            color: var(--text2);
            font-family: 'Outfit', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn-sm-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
        .btn-sm-outline:active { transform: scale(0.95); }

        /* live dot */
        .live-dot {
            width: 7px; height: 7px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.6s infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(1.4); }
        }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            #appSidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100vh;
                transform: translateX(-100%);
            }
            #appSidebar.open { transform: translateX(0); }
            #mobileMenuBtn { display: flex; }
            #mainView { padding: 1rem; }
            .card { padding: 1rem; border-radius: 14px; }
        }
    </style>
</head>
<body>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside id="appSidebar">
    <div class="sidebar-logo">
        <div class="sidebar-logo-icon"><i class="fas fa-chart-line"></i></div>
        <span class="sidebar-logo-text">Ascendia <span>Hire</span></span>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-user">
        <div class="sidebar-user-info">
            <div class="sidebar-avatar" id="sidebarAvatar">?</div>
            <div>
                <div class="sidebar-user-name" id="sidebarName"></div>
                <div class="sidebar-user-email" id="sidebarEmail"></div>
            </div>
        </div>
        <span id="sidebarRole"></span>
        <br>
        <button class="logout-btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</aside>

<!-- MAIN -->
<main>
    <header id="appHeader">
        <button id="mobileMenuBtn" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
        <span id="pageTitle"></span>
        <span id="headerBadge"></span>
        <div id="themeControls">
            <button class="theme-icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle light/dark"><i class="fas fa-moon" id="themeToggleIcon"></i></button>
            <div style="position:relative">
                <button class="theme-icon-btn" onclick="toggleAccentPanel()" title="Accent color"><i class="fas fa-palette"></i></button>
                <div id="accentPanel">
                    <div class="accent-swatch" data-accent="indigo"  style="background:#4f46e5" onclick="setAccent('indigo')"></div>
                    <div class="accent-swatch" data-accent="violet"  style="background:#8b5cf6" onclick="setAccent('violet')"></div>
                    <div class="accent-swatch" data-accent="emerald" style="background:#059669" onclick="setAccent('emerald')"></div>
                    <div class="accent-swatch" data-accent="rose"    style="background:#e11d48" onclick="setAccent('rose')"></div>
                    <div class="accent-swatch" data-accent="amber"   style="background:#d97706" onclick="setAccent('amber')"></div>
                    <div class="accent-swatch" data-accent="sky"     style="background:#0284c7" onclick="setAccent('sky')"></div>
                </div>
            </div>
        </div>
    </header>
    <div id="mainView"></div>
</main>

<div id="toast"></div>
<script src="JS/dashboard.js"></script>
</body>
</html>
